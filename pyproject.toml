[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrader"
version = "0.1.0"
description = "AI paper-trading service for the Indian NSE market (Phase 1: paper broker only)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",   # the code calls beta.messages.create with fallbacks and output_config (effort + JSON-schema format) and validates the reply itself in agents/llm.py; it does not use beta.messages.parse
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "yfinance",
    "pandas",
    "feedparser",
    "httpx",
    "tzdata",
    "truststore",         # use the OS certificate store, so HTTPS works behind a TLS-inspecting corporate proxy
    "python-telegram-bot[job-queue]>=21",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
